<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive Neo</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
  color: white;
}

/* TOP GLASS BAR */
.topbar {
  position: sticky;
  top: 0;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.08);
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.brand {
  font-weight: bold;
  font-size: 18px;
  color: #00c6ff;
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap: 10px;
  padding: 10px;
}

/* PANELS */
.panel {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  padding: 12px;
  border-radius: 15px;
}

/* OWNER */
.owner img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

/* FEED CARD */
.card {
  background: rgba(255,255,255,0.08);
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.02);
}

/* IMAGE */
img.user {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  float: left;
  margin-right: 10px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 8px;
  border-radius: 10px;
  border: none;
  background: #00c6ff;
  color: white;
  margin-top: 8px;
}

/* SKILL TAGS */
.tag {
  display: inline-block;
  padding: 5px 10px;
  margin: 3px;
  background: rgba(0,198,255,0.2);
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">SkillHive Neo</div>
  <input id="search" placeholder="Search skills..." oninput="filter()" style="padding:8px;border-radius:10px;border:none;">
</div>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="panel owner">
    <h3>Your Profile</h3>
    <img id="ownerImg">
    <p id="ownerName"></p>
  </div>

  <!-- CENTER FEED -->
  <div class="panel">
    <div id="feed"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h3>Trending Skills</h3>
    <div id="skills"></div>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec";

let users = [];
const currentUser = JSON.parse(localStorage.getItem("user"));

if (!currentUser) window.location.href = "login.html";

/* OWNER */
function loadOwner() {
  document.getElementById("ownerName").innerText = currentUser.username;

  let img = currentUser["upload profile photo"] || "";
  const id = img.match(/[-\w]{25,}/);
  if (id) img = "https://drive.google.com/thumbnail?id=" + id;

  document.getElementById("ownerImg").src = img;
}

/* LOAD USERS */
async function load() {
  const res = await fetch(API_URL);
  users = await res.json();

  render(users);
  renderSkills(users);
}

/* RENDER FEED */
function render(list) {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  list.forEach(u => {

    let img = u["upload profile photo"] || "";
    const id = img.match(/[-\w]{25,}/);
    if (id) img = "https://drive.google.com/thumbnail?id=" + id;

    feed.innerHTML += `
      <div class="card">
        <img class="user" src="${img}">
        <h4>${u.username}</h4>
        <p>${u.skill || ""}</p>
        <button onclick="book('${u.username}')">Book</button>
      </div>
    `;
  });
}

/* SKILLS */
function renderSkills(list) {
  const box = document.getElementById("skills");
  const set = new Set();

  list.forEach(u => {
    if (u.skill) set.add(u.skill);
  });

  set.forEach(s => {
    box.innerHTML += `<div class="tag" onclick="filterSkill('${s}')">${s}</div>`;
  });
}

/* FILTER */
function filter() {
  const q = document.getElementById("search").value.toLowerCase();
  render(users.filter(u => (u.username||"").toLowerCase().includes(q)));
}

function filterSkill(skill) {
  render(users.filter(u => u.skill === skill));
}

/* BOOK */
function book(name) {
  alert(currentUser.username + " booked " + name);
}

/* INIT */
loadOwner();
load();

</script>

</body>
</html>
