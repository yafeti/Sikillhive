<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #d35400;
  padding: 12px;
  color: white;
  position: sticky;
  top: 0;
}

.search {
  width: 60%;
  padding: 8px;
  border-radius: 20px;
  border: none;
  outline: none;
}

.menu {
  font-size: 24px;
  cursor: pointer;
}

/* MAIN LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
  padding: 10px;
}

/* LEFT PROFILE */
.profile-box {
  background: #e67e22;
  padding: 15px;
  border-radius: 15px;
  color: white;
  height: fit-content;
}

.profile-box img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

/* TRENDING */
.trending {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.trend-card {
  background: white;
  height: 80px;
  border-radius: 10px;
}

/* MAIN CARD */
.card {
  background: #d35400;
  padding: 15px;
  border-radius: 20px;
  color: white;
  margin-top: 10px;
}

.card img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
}

/* WHY SECTION */
.why {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* BOOK BUTTON */
button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 15px;
  background: #ff6f00;
  color: white;
  font-size: 16px;
}

/* RESPONSIVE */
@media(max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
  }

  .trending {
    grid-template-columns: repeat(2, 1fr);
  }

  .search {
    width: 50%;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div><b>SkillHive</b></div>
  <input class="search" placeholder="Search here.....">
  <div class="menu">☰</div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- LEFT PROFILE -->
  <div class="profile-box">
    <img id="ownerImg">
    <h3 id="ownerName"></h3>

    <p><b>Name:</b> <span id="name"></span></p>
    <p><b>Skill:</b> <span id="skill"></span></p>
    <p><b>Experience:</b> <span id="exp"></span></p>
    <p><b>Location:</b> <span id="loc"></span></p>
    <p><b>Contact:</b> <span id="contact"></span></p>
    <p><b>Portfolio:</b> <span id="port"></span></p>
  </div>

  <!-- RIGHT SIDE -->
  <div>

    <!-- TRENDING -->
    <h3>Trending Skills</h3>
    <div class="trending">
      <div class="trend-card"></div>
      <div class="trend-card"></div>
      <div class="trend-card"></div>
      <div class="trend-card"></div>
    </div>

    <!-- MAIN CARD -->
    <div class="card">
      <img id="mainImg">
      <h2 id="mainName"></h2>

      <div class="why">
        <h4>Why you?</h4>
        <p>short description of why he should be chosen</p>
      </div>

      <p><b>Experience:</b> 3 years</p>
      <p><b>Location:</b> Mitundu</p>
      <p><b>Portfolio:</b> unavailable</p>

      <button>Book Us</button>
    </div>

  </div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "login.html";
}

// OWNER DATA
document.getElementById("ownerName").innerText = user.username || "";
document.getElementById("name").innerText = user.username || "";
document.getElementById("skill").innerText = user.skill || "";
document.getElementById("exp").innerText = user.experience || "";
document.getElementById("loc").innerText = user.location || "";
document.getElementById("contact").innerText = user["phone number"] || "";
document.getElementById("port").innerText = user["portifolio link"] || "";

// IMAGE FIX
let img = user["upload profile photo"] || "";
const id = img.match(/[-\w]{25,}/);
if (id) {
  img = "https://drive.google.com/thumbnail?id=" + id;
}

document.getElementById("ownerImg").src = img;
document.getElementById("mainImg").src = img;
document.getElementById("mainName").innerText = user.username;

</script>

</body>
</html>
