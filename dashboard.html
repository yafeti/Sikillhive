<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #d35400;
  padding: 12px;
  color: white;
  position: sticky;
  top: 0;
}

.search {
  width: 60%;
  padding: 8px;
  border-radius: 20px;
  border: none;
}

.menu {
  font-size: 24px;
}

/* MAIN */
.container {
  padding: 10px;
}

/* PROFILE */
.profile-box {
  background: #e67e22;
  padding: 15px;
  border-radius: 15px;
  color: white;
}

.profile-box img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

/* WHY */
.why {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* TRENDING */
.trending {
  margin-top: 15px;
}

.trend-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.trend-card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

/* OTHER USERS */
.user-card {
  background: #e67e22;
  padding: 15px;
  border-radius: 15px;
  color: white;
  margin-top: 10px;
}

.user-card img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

.user-card .why {
  background: white;
  color: black;
  padding: 8px;
  border-radius: 8px;
  margin-top: 8px;
}

.book-btn {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #ff6f00;
  color: white;
  font-weight: bold;
}

/* MOBILE */
@media(max-width: 768px) {
  .search {
    width: 50%;
  }

  .trend-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <b>SkillHive</b>
  <input class="search" placeholder="Search here...">
  <div class="menu">☰</div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- PROFILE -->
  <div class="profile-box">
    <img id="img">

    <h3 id="name"></h3>

    <p><b>Skill:</b> <span id="skill"></span></p>
    <p><b>Experience:</b> <span id="exp"></span></p>
    <p><b>Location:</b> <span id="loc"></span></p>
    <p><b>Contact:</b> <span id="contact"></span></p>
    <p><b>Portfolio:</b> <span id="port"></span></p>

    <div class="why">
      <h4>Why you?</h4>
      <p id="why"></p>
    </div>
  </div>

  <!-- TRENDING -->
  <div class="trending">
    <h3>Trending Skills</h3>
    <div class="trend-grid" id="trends"></div>
  </div>

  <!-- OTHER USERS -->
  <h3>Available SkillMen</h3>
  <div id="others"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec";

const currentUser = JSON.parse(localStorage.getItem("user"));

if (!currentUser) {
  window.location.href = "login.html";
}

/* LOAD */
async function load() {
  const res = await fetch(API_URL);
  const users = await res.json();

  const user = users.find(u =>
    (u.username || "").trim().toLowerCase() ===
    (currentUser.username || "").trim().toLowerCase()
  );

  if (!user) return;

  // PROFILE
  document.getElementById("name").innerText = user.username || "";
  document.getElementById("skill").innerText = user.skill || "";
  document.getElementById("exp").innerText = user.experience || "";
  document.getElementById("loc").innerText = user.location || "";
  document.getElementById("contact").innerText = user["phone number"] || "";
  document.getElementById("port").innerText = user["portifolio link"] || "";

  document.getElementById("why").innerText =
    user["why you"] ||
    user["why"] ||
    user["description"] ||
    "No description";

  // IMAGE FIX
  let img = user["upload profile photo"] || "";
  const id = img.match(/[-\w]{25,}/);
  if (id) img = "https://drive.google.com/thumbnail?id=" + id;

  document.getElementById("img").src = img;

  // TRENDING
  const trends = document.getElementById("trends");
  const skills = new Set();

  users.forEach(u => {
    if (u.skill) skills.add(u.skill);
  });

  trends.innerHTML = "";
  skills.forEach(s => {
    trends.innerHTML += `<div class="trend-card">${s}</div>`;
  });

  // OTHER USERS
  renderOthers(users);
}

/* OTHER USERS */
function renderOthers(users) {
  const container = document.getElementById("others");
  container.innerHTML = "";

  users.forEach(u => {

    if (
      (u.username || "").trim().toLowerCase() ===
      (currentUser.username || "").trim().toLowerCase()
    ) return;

    let img = u["upload profile photo"] || "";
    const id = img.match(/[-\w]{25,}/);
    if (id) img = "https://drive.google.com/thumbnail?id=" + id;

    const why =
      u["why you"] ||
      u["why"] ||
      u["description"] ||
      "No description";

    container.innerHTML += `
      <div class="user-card">

        <img src="${img}">
        <h3>${u.username}</h3>

        <p><b>Skill:</b> ${u.skill || ""}</p>
        <p><b>Experience:</b> ${u.experience || ""}</p>
        <p><b>Location:</b> ${u.location || ""}</p>
        <p><b>Contact:</b> ${u["phone number"] || ""}</p>
        <p><b>Portfolio:</b> ${u["portifolio link"] || ""}</p>

        <div class="why">
          <b>Why you?</b><br>
          ${why}
        </div>

        <button class="book-btn" onclick="bookUser('${u.username}')">
          Book
        </button>

      </div>
    `;
  });
}

/* BOOK */
function bookUser(name) {
  alert(currentUser.username + " booked " + name);
}

load();

</script>

</body>
</html>
