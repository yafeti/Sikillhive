<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #8e44ad;
  padding: 12px;
  color: white;
  position: sticky;
  top: 0;
  z-index: 999;
}

.search {
  width: 60%;
  padding: 8px;
  border-radius: 20px;
  border: none;
}

.menu {
  font-size: 24px;
  cursor: pointer;
  padding: 8px 12px;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  right: -300px;
  width: 280px;
  height: 100vh;
  background: white;
  box-shadow: -2px 0 10px rgba(0,0,0,0.2);
  padding: 15px;
  transition: 0.3s;
  z-index: 1000;
  overflow-y: auto;
}

.sidebar.active {
  right: 0;
}

.menu-msg {
  background: #f4e9fb;
  padding: 8px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}

/* PROFILE */
.profile-box {
  background: #a569bd;
  padding: 15px;
  border-radius: 15px;
  color: white;
  position: sticky;
  top: 70px;
}

.profile-box img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

/* ACTION ROW */
.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #8e44ad, #a569bd);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* LISTS */
.container {
  padding: 10px;
}

.seek-card, .user-card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* HIRE REQUESTS */
.req-box {
  background: #f6f0fb;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.req-actions {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

.req-actions button {
  padding: 8px;
  font-size: 12px;
}

/* MOBILE */
@media(max-width:768px){
  .search{width:55%;}
}

</style>
</head>

<body>

<div class="topbar">
  <b>SkillHive</b>
  <input class="search" placeholder="Search..." oninput="searchUsers(this.value)">
  <div class="menu" onclick="toggleMenu()">☰</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="menu">

  <h3>Notifications</h3>

  <div id="messages"></div>

  <hr>

  <h4>Available Skills</h4>
  <div id="skillList"></div>

  <hr>

  <p>📩 Requests: <span id="reqCount">0</span></p>
  <p>🔥 Seeks: <span id="seekCount">0</span></p>

  <button onclick="logout()" style="background:#e74c3c;margin-top:10px;">
    🚪 Logout
  </button>
</div>

<div class="container">

  <!-- PROFILE -->
  <div class="profile-box">
    <img id="img">
    <h3 id="name"></h3>

    <p><b>Skill:</b> <span id="skill"></span></p>
    <p><b>Experience:</b> <span id="exp"></span></p>
    <p><b>Location:</b> <span id="loc"></span></p>

    <div class="action-row">
      <button onclick="hireUser(currentUser.username)">💼 Hire Me</button>
    </div>
  </div>

  <h3>🔥 Seeks</h3>
  <div id="seeks"></div>

  <h3>👥 Users</h3>
  <div id="users"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec";

let allUsers = [];

let seeks = JSON.parse(localStorage.getItem("seeks") || "[]");
let requests = JSON.parse(localStorage.getItem("requests") || "[]");
let messages = JSON.parse(localStorage.getItem("messages") || "[]");

const currentUser = JSON.parse(localStorage.getItem("user"));
if (!currentUser) window.location.href = "login.html";

/* MENU */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function logout(){
  localStorage.removeItem("user");
  window.location.href="login.html";
}

/* ---------------- HIRE ---------------- */
function hireUser(name){

  const req = {
    from: currentUser.username,
    to: name,
    status: "pending",
    time: Date.now()
  };

  requests.push(req);
  localStorage.setItem("requests", JSON.stringify(requests));

  renderRequests();
}

/* ACCEPT / REJECT */
function acceptRequest(i){
  requests[i].status = "accepted";
  addMessage(`✅ Hire accepted by ${currentUser.username}`, requests[i].from);
  saveAll();
  renderRequests();
}

function rejectRequest(i){
  requests[i].status = "rejected";
  addMessage(`❌ Hire rejected by ${currentUser.username}`, requests[i].from);
  saveAll();
  renderRequests();
}

/* ---------------- MESSAGE ---------------- */
function addMessage(text, to){
  messages.push({
    from: currentUser.username,
    to: to,
    text: text,
    time: Date.now()
  });

  localStorage.setItem("messages", JSON.stringify(messages));
}

/* ---------------- RENDER REQUESTS ---------------- */
function renderRequests(){
  const box = document.getElementById("messages");
  box.innerHTML = "";

  const myRequests = requests.filter(r => r.to === currentUser.username);

  document.getElementById("reqCount").innerText = myRequests.length;

  myRequests.forEach((r,i)=>{

    box.innerHTML += `
      <div class="req-box">
        <b>${r.from}</b> wants to hire you
        <div class="req-actions">
          <button onclick="acceptRequest(${i})" style="background:green;">Accept</button>
          <button onclick="rejectRequest(${i})" style="background:red;">Reject</button>
        </div>
        <small>Status: ${r.status}</small>
      </div>
    `;
  });
}

/* ---------------- SEEKS ---------------- */
function renderSeeks(){
  const box = document.getElementById("seeks");
  box.innerHTML = "";

  seeks.forEach(s=>{
    box.innerHTML += `
      <div class="seek-card">
        <b>${s.who}</b><br>
        ${s.seek}
        ${s.photo ? `<br><img src="${s.photo}" width="60" height="60" style="border-radius:50%">` : ""}
      </div>
    `;
  });

  document.getElementById("seekCount").innerText = seeks.length;
}

/* ---------------- USERS ---------------- */
function renderUsers(){
  const box = document.getElementById("users");
  box.innerHTML = "";

  allUsers.forEach(u=>{
    box.innerHTML += `
      <div class="user-card">
        <b>${u.username}</b><br>
        ${u.skill}<br>
        ${u.location}
        <button onclick="hireUser('${u.username}')">Hire</button>
      </div>
    `;
  });
}

/* ---------------- LOAD ---------------- */
async function load(){

  const res = await fetch(API_URL);
  allUsers = await res.json();

  const me = allUsers.find(u => u.username === currentUser.username);

  if(me){
    document.getElementById("name").innerText = me.username;
    document.getElementById("skill").innerText = me.skill;
    document.getElementById("exp").innerText = me.experience;
    document.getElementById("loc").innerText = me.location;
  }

  renderRequests();
  renderSeeks();
  renderUsers();
}

load();

/* SAVE */
function saveAll(){
  localStorage.setItem("requests", JSON.stringify(requests));
}

</script>

</body>
</html>
