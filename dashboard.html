<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #8e44ad;
  padding: 12px;
  color: white;
  position: sticky;
  top: 0;
  z-index: 999;
}

.search {
  width: 60%;
  padding: 8px;
  border-radius: 20px;
  border: none;
}

.menu {
  font-size: 24px;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 8px;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  right: -260px;
  width: 250px;
  height: 100vh;
  background: white;
  box-shadow: -2px 0 10px rgba(0,0,0,0.2);
  padding: 15px;
  transition: 0.3s;
  z-index: 1000;
  overflow-y: auto;
}

.sidebar.active {
  right: 0;
}

.skill-item {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

/* MAIN */
.container {
  padding: 10px;
}

/* PROFILE */
.profile-box {
  background: #a569bd;
  padding: 15px;
  border-radius: 15px;
  color: white;
  position: sticky;
  top: 70px;
  z-index: 10;
}

.profile-box img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

/* WHY */
.why {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* TRENDING */
.trend-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.trend-card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

/* SECTION TITLE */
.section-title {
  position: sticky;
  top: 240px;
  background: #f3f3f3;
  padding: 8px 0;
  z-index: 5;
}

/* SEEK */
.seek {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* USERS */
.user-card {
  background: #a569bd;
  padding: 15px;
  border-radius: 15px;
  color: white;
  margin-top: 10px;
}

.user-card img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

/* BUTTONS */
button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #8e44ad, #a569bd);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* MOBILE */
@media(max-width: 768px) {
  .trend-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="topbar">
  <b>SkillHive</b>
  <input class="search" placeholder="Search..." oninput="searchUsers(this.value)">
  <div class="menu" onclick="toggleMenu()">☰</div>
</div>

<div class="sidebar" id="menu">
  <h3>Available Skills</h3>
  <div id="skillList"></div>
</div>

<div class="container">

  <div class="profile-box">
    <img id="img">
    <h3 id="name"></h3>

    <p><b>Skill:</b> <span id="skill"></span></p>
    <p><b>Experience:</b> <span id="exp"></span></p>
    <p><b>Location:</b> <span id="loc"></span></p>
    <p><b>Contact:</b> <span id="contact"></span></p>

    <div class="why">
      <b>Why you?</b>
      <p id="why"></p>
    </div>
  </div>

  <h3 class="section-title">Trending Skills</h3>
  <div class="trend-grid" id="trends"></div>

  <button onclick="postSeek()">+ Post Seek</button>
  <div id="seeks"></div>

  <h3 class="section-title">Available SkillMen</h3>
  <div id="others"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec";
const SEEK_FORM = "https://forms.gle/caxjKmM2d7jTNMf96";

let allUsers = [];
const currentUser = JSON.parse(localStorage.getItem("user"));

if (!currentUser) window.location.href = "login.html";

function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}

function postSeek() {
  window.open(SEEK_FORM, "_blank");
}

async function load() {
  const res = await fetch(API_URL);
  allUsers = await res.json();

  const user = allUsers.find(u =>
    (u.username || "").toLowerCase().trim() ===
    (currentUser.username || "").toLowerCase().trim()
  );

  if (!user) return;

  document.getElementById("name").innerText = user.username;
  document.getElementById("skill").innerText = user.skill;
  document.getElementById("exp").innerText = user.experience;
  document.getElementById("loc").innerText = user.location;
  document.getElementById("contact").innerText = user["phone number"];

  document.getElementById("why").innerText =
    user["why you"] || user["description"] || "No description";

  let img = user["upload profile photo"] || "";
  const id = img.match(/[-\w]{25,}/);
  if (id) img = "https://drive.google.com/thumbnail?id=" + id;

  document.getElementById("img").src = img;

  renderSkills();
  renderTrends();
  renderSeeks();
  renderUsers(allUsers);
}

function renderSkills() {
  const list = document.getElementById("skillList");
  const skills = new Set();

  allUsers.forEach(u => u.skill && skills.add(u.skill));

  list.innerHTML = "";
  skills.forEach(s => {
    list.innerHTML += `<div class="skill-item">${s}</div>`;
  });
}

function renderTrends() {
  const trends = document.getElementById("trends");
  const skills = new Set();

  allUsers.forEach(u => u.skill && skills.add(u.skill));

  trends.innerHTML = "";
  skills.forEach(s => {
    trends.innerHTML += `<div class="trend-card">${s}</div>`;
  });
}

function renderSeeks() {
  const seeksDiv = document.getElementById("seeks");
  seeksDiv.innerHTML = "";

  allUsers.forEach(u => {
    const seek =
      u.seek ||
      u["what are you looking for?"] ||
      u.status ||
      "";

    if (seek) {
      seeksDiv.innerHTML += `
        <div class="seek">
          <b>${u.username}</b><br>
          ${seek}
          <br><br>
          <button onclick="hireUser('${u.username}')">Hire</button>
        </div>
      `;
    }
  });
}

function renderUsers(list) {
  const container = document.getElementById("others");
  container.innerHTML = "";

  list.forEach(u => {
    if (u.username === currentUser.username) return;

    let img = u["upload profile photo"] || "";
    const id = img.match(/[-\w]{25,}/);
    if (id) img = "https://drive.google.com/thumbnail?id=" + id;

    container.innerHTML += `
      <div class="user-card">
        <img src="${img}">
        <h3>${u.username}</h3>
        <p><b>Skill:</b> ${u.skill}</p>
        <p><b>Location:</b> ${u.location}</p>

        <button onclick="hireUser('${u.username}')">
          Hire
        </button>
      </div>
    `;
  });
}

function searchUsers(q) {
  q = q.toLowerCase();

  const filtered = allUsers.filter(u =>
    (u.username || "").toLowerCase().includes(q) ||
    (u.skill || "").toLowerCase().includes(q) ||
    (u.location || "").toLowerCase().includes(q)
  );

  renderUsers(filtered);
}

function hireUser(name) {
  alert(currentUser.username + " wants to hire " + name);
}

load();

</script>

</body>
</html
