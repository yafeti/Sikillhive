<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP */
.topbar {
  display: flex;
  justify-content: space-between;
  background: #8e44ad;
  color: white;
  padding: 12px;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  right: -300px;
  top: 0;
  width: 280px;
  height: 100%;
  background: white;
  padding: 15px;
  transition: 0.3s;
  overflow-y: auto;
}

.sidebar.active { right: 0; }

.item {
  background: #f3e9fb;
  padding: 8px;
  margin-bottom: 6px;
  border-radius: 8px;
}

/* PROFILE */
.profile {
  background: #a569bd;
  color: white;
  padding: 15px;
  margin: 10px;
  border-radius: 15px;
}

/* USERS */
.user {
  background: white;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  background: #8e44ad;
  color: white;
}

/* CHAT */
.chat {
  position: fixed;
  bottom: 0;
  right: 10px;
  width: 300px;
  height: 400px;
  background: white;
  display: none;
  flex-direction: column;
}

.chatHead {
  background: #8e44ad;
  color: white;
  padding: 10px;
}

.chatBody {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.chatMsg {
  background: #eee;
  margin: 5px 0;
  padding: 5px;
  border-radius: 6px;
}

</style>
</head>

<body>

<div class="topbar">
  <b>SkillHive</b>
  <div onclick="toggleMenu()">☰</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="menu">

  <h3>📩 Requests</h3>
  <div id="requests"></div>

  <h3>🔔 Notifications</h3>
  <div id="notes"></div>

  <button onclick="logout()" style="background:red;">Logout</button>
</div>

<!-- PROFILE -->
<div class="profile">
  <h3 id="name"></h3>
  <p id="skill"></p>
</div>

<!-- USERS -->
<div id="users"></div>

<!-- CHAT -->
<div class="chat" id="chatBox">
  <div class="chatHead" id="chatTitle"></div>
  <div class="chatBody" id="chatBody"></div>
  <input id="msg" placeholder="Message..." style="width:100%">
  <button onclick="sendMsg()">Send</button>
</div>

<script>

let currentUser = JSON.parse(localStorage.getItem("user"));
if(!currentUser) location.href="login.html";

let users=[];
let requests=JSON.parse(localStorage.getItem("requests")||"[]");
let notes=JSON.parse(localStorage.getItem("notes")||"[]");
let chats=JSON.parse(localStorage.getItem("chats")||"[]");
let messages=JSON.parse(localStorage.getItem("messages")||"[]");

let activeChat=null;

/* MENU */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function logout(){
  localStorage.removeItem("user");
  location.href="login.html";
}

/* SEND REQUEST */
function hireUser(name){

  if(name===currentUser.username){
    alert("Cannot hire yourself");
    return;
  }

  requests.push({
    from:currentUser.username,
    to:name,
    status:"pending"
  });

  save();
  renderAll();
}

/* ACCEPT */
function accept(i){

  let r=requests[i];
  r.status="accepted";

  chats.push([r.from,r.to]);

  notes.push(`✅ ${r.to} accepted ${r.from}`);

  save();
  renderAll();
}

/* REJECT */
function reject(i){

  let r=requests[i];
  r.status="rejected";

  notes.push(`❌ ${r.to} rejected ${r.from}`);

  save();
  renderAll();
}

/* CHECK CHAT */
function canChat(user){
  return chats.some(c=>c.includes(currentUser.username)&&c.includes(user));
}

/* OPEN CHAT */
function openChat(user){

  if(!canChat(user)){
    alert("Chat locked. Wait for acceptance.");
    return;
  }

  activeChat=user;
  document.getElementById("chatBox").style.display="flex";
  document.getElementById("chatTitle").innerText="Chat with "+user;

  renderChat();
}

/* SEND MESSAGE */
function sendMsg(){

  let text=document.getElementById("msg").value;
  if(!text) return;

  messages.push({
    from:currentUser.username,
    to:activeChat,
    text:text
  });

  save();
  renderChat();
}

/* RENDER CHAT */
function renderChat(){

  let box=document.getElementById("chatBody");
  box.innerHTML="";

  messages.filter(m=>
    (m.from===currentUser.username&&m.to===activeChat)||
    (m.from===activeChat&&m.to===currentUser.username)
  ).forEach(m=>{
    box.innerHTML+=`<div class="chatMsg"><b>${m.from}:</b> ${m.text}</div>`;
  });
}
