<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f0f0f, #2b2b2b);
  color: white;
}

.container {
  padding: 15px;
}

h2 {
  text-align: center;
}

.search {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
}

.card {
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
}

button {
  padding: 8px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  background: #00c6ff;
  color: white;
}

.owner {
  border: 2px solid yellow;
}
</style>
</head>

<body>

<div class="container">
  <h2>SkillHive 👋</h2>

  <input class="search" placeholder="Search users..." oninput="searchUsers(this.value)">

  <div id="users"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec";

const currentUser = JSON.parse(localStorage.getItem("user"));

if (!currentUser) {
  window.location.href = "login.html";
}

let allUsers = [];

// Load users
async function loadUsers() {
  const res = await fetch(API_URL);
  const data = await res.json();

  allUsers = data;
  displayUsers(data);
}

// Display users
function displayUsers(users) {
  const container = document.getElementById("users");
  container.innerHTML = "";

  users.forEach(user => {

    // image fix
    let photo = user["upload profile photo"] || "";
    const match = photo.match(/[-\w]{25,}/);
    if (match) {
      photo = "https://drive.google.com/thumbnail?id=" + match[0];
    }

    const isOwner = user.username === currentUser.username;

    container.innerHTML += `
      <div class="card ${isOwner ? "owner" : ""}">
        <img src="${photo}">
        <h3>${user.username}</h3>
        <p><b>Skill:</b> ${user.skill || "N/A"}</p>
        <p><b>Experience:</b> ${user.experience || "N/A"}</p>
        <p><b>Location:</b> ${user.location || "N/A"}</p>

        ${user.portfolio ? `<a href="${user.portfolio}" target="_blank">View Portfolio</a>` : ""}

        <br>

        ${!isOwner ? `<button onclick="bookUser('${user.username}')">Book Me</button>` : "<p>(You)</p>"}
      </div>
    `;
  });
}

// Search function
function searchUsers(query) {
  const filtered = allUsers.filter(u =>
    u.username.toLowerCase().includes(query.toLowerCase()) ||
    (u.skill || "").toLowerCase().includes(query.toLowerCase())
  );

  displayUsers(filtered);
}

// Book user (simulation)
function bookUser(username) {
  alert(currentUser.username + " booked " + username + " ✅");
}

// load on start
loadUsers();

</script>

</body>
</html>
