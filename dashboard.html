<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #d35400;
  padding: 12px;
  color: white;
  position: sticky;
  top: 0;
}

.search {
  width: 60%;
  padding: 8px;
  border-radius: 20px;
  border: none;
  outline: none;
}

.menu {
  font-size: 24px;
  cursor: pointer;
}

/* MAIN CONTAINER */
.container {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* MAIN CARD (FULL WIDTH) */
.card {
  background: #d35400;
  padding: 15px;
  border-radius: 20px;
  color: white;
}

.card img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

/* WHY SECTION */
.why {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 15px;
  background: #ff6f00;
  color: white;
  font-size: 16px;
  margin-top: 10px;
}

/* TRENDING */
.trending {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.trend-card {
  background: white;
  height: 80px;
  border-radius: 10px;
}

/* MEMBERS LIST */
.members {
  display: grid;
  gap: 10px;
}

.member-card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.member-card img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
}

/* RESPONSIVE */
@media(max-width: 768px) {
  .trending {
    grid-template-columns: repeat(2, 1fr);
  }

  .search {
    width: 50%;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div><b>SkillHive</b></div>
  <input class="search" placeholder="Search here.....">
  <div class="menu">☰</div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- MAIN CARD (FULL WIDTH) -->
  <div class="card">
    <img id="mainImg">
    <h2 id="mainName"></h2>

    <p><b>Experience:</b> 3 years</p>
    <p><b>Location:</b> Mitundu</p>
    <p><b>Portfolio:</b> unavailable</p>

    <div class="why">
      <h4>Why you?</h4>
      <p>short description of why you should be chosen</p>
    </div>

    <button>Book Us</button>
  </div>

  <!-- TRENDING -->
  <h3>Trending Skills</h3>
  <div class="trending">
    <div class="trend-card"></div>
    <div class="trend-card"></div>
    <div class="trend-card"></div>
    <div class="trend-card"></div>
  </div>

  <!-- OTHER MEMBERS -->
  <h3>Other Registered Members</h3>
  <div class="members" id="membersList"></div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "login.html";
}

// MAIN USER DATA
document.getElementById("mainName").innerText = user.username || "";

// IMAGE FIX (Google Drive)
let img = user["upload profile photo"] || "";
const id = img.match(/[-\w]{25,}/);
if (id) {
  img = "https://drive.google.com/thumbnail?id=" + id;
}

document.getElementById("mainImg").src = img;


/* OPTIONAL: LOAD OTHER USERS */
let users = JSON.parse(localStorage.getItem("users")) || [];
let container = document.getElementById("membersList");

users.forEach(u => {
  let img = u["upload profile photo"] || "";
  const id = img.match(/[-\w]{25,}/);
  if (id) {
    img = "https://drive.google.com/thumbnail?id=" + id;
  }

  let div = document.createElement("div");
  div.className = "member-card";

  div.innerHTML = `
    <img src="${img}">
    <div>
      <b>${u.username || "No Name"}</b><br>
      <small>${u.skill || ""}</small>
    </div>
  `;

  container.appendChild(div);
});

</script>

</body>
</html>
