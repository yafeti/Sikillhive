<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f3f3;
}

/* TOP */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #8e44ad;
  color: white;
  padding: 12px;
  position: sticky;
  top: 0;
  z-index: 999;
}

.menu {
  font-size: 24px;
  cursor: pointer;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  right: -300px;
  top: 0;
  width: 280px;
  height: 100%;
  background: white;
  padding: 15px;
  transition: 0.3s;
  overflow-y: auto;
  z-index: 1000;
}

.sidebar.active { right: 0; }

.skill-item {
  padding: 8px;
  margin: 5px 0;
  background: #f3e9fb;
  border-radius: 8px;
  cursor: pointer;
}

.skill-item:hover {
  background: #e1c9f3;
}

/* PROFILE */
.profile {
  background: #a569bd;
  color: white;
  margin: 10px;
  padding: 15px;
  border-radius: 15px;
}

/* USERS */
.user {
  background: white;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  background: #8e44ad;
  color: white;
}

/* FEED */
.feed {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
}

</style>
</head>

<body>

<div class="topbar">
  <b>SkillHive</b>
  <div class="menu" onclick="toggleMenu()">☰</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="menu">

  <h3>📌 Skills</h3>
  <div class="skill-item" onclick="filterSkill('ALL')">🌐 All Skills</div>

  <div id="skills"></div>

  <hr>

  <h3>Notifications</h3>
  <div id="notifications"></div>

  <hr>

  <button onclick="logout()" style="background:red;">Logout</button>
</div>

<!-- PROFILE -->
<div class="profile">
  <h3 id="name"></h3>
  <p id="skill"></p>

  <p>🔥 Hires: <span id="hireCount">0</span></p>
  <p>🔎 Seeks: <span id="seekCount">0</span></p>

  <button onclick="addSeek()">➕ Add Seek</button>
</div>

<!-- FEED -->
<h3 style="padding:10px;">Seek Feed</h3>
<div class="feed" id="feed"></div>

<!-- USERS -->
<h3 style="padding:10px;">Skilled Men</h3>
<div id="users"></div>

<script>

let currentUser = JSON.parse(localStorage.getItem("user"));
if(!currentUser) location.href="login.html";

let users = [];
let seeks = JSON.parse(localStorage.getItem("seeks")||"[]");
let hires = JSON.parse(localStorage.getItem("hires")||"[]");
let notifications = JSON.parse(localStorage.getItem("notes")||"[]");

let activeSkillFilter = "ALL";

/* MENU */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function logout(){
  localStorage.removeItem("user");
  location.href="login.html";
}

/* SEEK */
function addSeek(){
  let text = prompt("What are you seeking?");
  if(!text) return;

  seeks.push({who:currentUser.username,seek:text});
  localStorage.setItem("seeks",JSON.stringify(seeks));
  renderAll();
}

/* FILTER SKILL CLICK */
function filterSkill(skill){
  activeSkillFilter = skill;
  renderUsers();
}

/* HIRE */
function hireUser(name){

  if(name === currentUser.username){
    alert("You cannot hire yourself");
    return;
  }

  hires.push({from:currentUser.username,to:name});
  localStorage.setItem("hires",JSON.stringify(hires));

  addNote(`${currentUser.username} hired ${name}`);
  renderAll();
}

/* NOTES */
function addNote(text){
  notifications.push(text);
  localStorage.setItem("notes",JSON.stringify(notifications));
}

/* SKILLS */
function renderSkills(){

  let set = new Set(users.map(u=>u.skill));

  document.getElementById("skills").innerHTML =
    [...set].map(s=>`
      <div class="skill-item" onclick="filterSkill('${s}')">
        ${s}
      </div>
    `).join("");
}

/* USERS (FILTERED) */
function renderUsers(){

  let list = users;

  if(activeSkillFilter !== "ALL"){
    list = users.filter(u => u.skill === activeSkillFilter);
  }

  document.getElementById("users").innerHTML =
    list.map(u=>`
      <div class="user">
        <b>${u.username}</b><br>
        ${u.skill}
        <button onclick="hireUser('${u.username}')">Hire</button>
      </div>
    `).join("");
}

/* FEED */
function renderFeed(){

  document.getElementById("feed").innerHTML =
    seeks.map(s=>`
      <div class="card">
        <b>${s.who}</b><br>
        ${s.seek}
      </div>
    `).join("");
}

/* NOTIFICATIONS */
function renderNotes(){

  document.getElementById("notifications").innerHTML =
    notifications.slice(-10).map(n=>`<div class="skill-item">${n}</div>`).join("");
}

/* COUNTS */
function updateCounts(){

  document.getElementById("hireCount").innerText =
    hires.filter(h=>h.to===currentUser.username).length;

  document.getElementById("seekCount").innerText = seeks.length;
}

/* MASTER */
function renderAll(){
  renderSkills();
  renderUsers();
  renderFeed();
  renderNotes();
  updateCounts();
}

/* LOAD */
async function load(){

  let res = await fetch("https://script.google.com/macros/s/AKfycbw4wf3BZe7SyRUR6tNAwWijfvo9mCFeXeuL0OgFYFAKxwTZbxnjM1h2p8QN14s_7ZZM2g/exec");
  users = await res.json();

  document.getElementById("name").innerText = currentUser.username;
  document.getElementById("skill").innerText = currentUser.skill || "";

  renderAll();
}

load();

</script>

</body>
</html>
